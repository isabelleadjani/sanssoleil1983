<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>sans soleil</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Pretendard CDN -->
  <link rel="stylesheet" as="style" crossorigin
    href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" />

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #0e0e0e;
      color: #eaeaea;
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 24px;
    }

    .frame {
      width: 100%;
      max-width: 360px;
      min-height: 520px;
      border: 1px solid #ffffff;
      padding: 32px 24px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    h1 {
      margin: 0 0 16px 0;
      font-size: 20px;
      font-weight: 500;
      letter-spacing: 0.04em;
    }

    .desc {
      font-size: 14px;
      line-height: 1.8;
      color: #d0d0d0;
      white-space: pre-line;
    }

    .footer {
      font-size: 12px;
      color: #888;
      text-align: right;
    }

    a {
      color: #aaa;
      text-decoration: none;
      border-bottom: 1px solid #555;
    }

    a:hover {
      color: #fff;
      border-bottom-color: #aaa;
    }
  </style>
</head>

<body>
  <div class="frame">
    <div>
      <h1>sans soleil</h1>
      <div class="desc">
archival fragment

I collect what remains.
moments, silence, afterimages.
      </div>
    </div>

    <div class="footer">
      <a href="https://twitter.com/">twitter</a>
    </div>
  </div>
</body>
</html>
